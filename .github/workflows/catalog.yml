name: Refresh catalog

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: jvm-switcher-catalog-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: github.repository == 'ralscha/jvm-switcher'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Regenerate catalog.json
        run: go run ./cmd/cataloggen -output catalog.json
      - name: Open pull request
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: catalog.json
          branch: refresh-catalog
          commit-message: Refresh JDK catalog
          title: Refresh JDK catalog
          body: Regenerated by `cmd/cataloggen`. Checksums and sizes come straight from the vendor sources.
          delete-branch: true
